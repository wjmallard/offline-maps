[project]
name = "offline-maps"
version = "0.1.0"
description = "Minimalist offline map viewer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "geopandas>=1.1.4",
    "pillow>=10.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.scripts]
offline-maps = "offline_maps.web.app:main"
offline-maps-pack = "offline_maps.pack:main"
offline-maps-sync = "offline_maps.sync:main"
offline-maps-sync-osm = "offline_maps.sync_osm:main"
offline-maps-sync-photos = "offline_maps.sync_photos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offline_maps"]
